services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dms-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "DmsPass123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - dms-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "DmsPass123!", "-Q", "SELECT 1", "-C", "-N"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: DmsSearch.Api/Dockerfile
    container_name: dms-api
    ports:
      - "3000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=db;Database=DmsDb;User Id=sa;Password=DmsPass123!;TrustServerCertificate=true;"
      Storage__BasePath: "/app/uploads"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dms-db-data: